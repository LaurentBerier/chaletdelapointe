kind = "web"
previewPath = "/"
title = "ChaletDeLaPointe"
version = "1.0.0"
id = "artifacts/chalet-de-la-pointe"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20529

[services.development]
run = "pnpm --filter @workspace/chalet-de-la-pointe run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/chalet-de-la-pointe", "run", "build" ]
publicDir = "artifacts/chalet-de-la-pointe/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20529"
BASE_PATH = "/"
